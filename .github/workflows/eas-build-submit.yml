name: EAS Build And Submit

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        default: "android"
        type: choice
        options:
          - android
          - ios
          - all
      profile:
        description: "EAS build profile"
        required: true
        default: "production"
      auto_submit:
        description: "Auto-submit after build"
        required: true
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build and optionally submit
        shell: bash
        run: |
          PLATFORM="${{ github.event.inputs.platform }}"
          PROFILE="${{ github.event.inputs.profile }}"
          AUTO_SUBMIT="${{ github.event.inputs.auto_submit }}"

          SUBMIT_FLAG=""
          if [ "$AUTO_SUBMIT" = "true" ]; then
            SUBMIT_FLAG="--auto-submit"
          fi

          # Run EAS build, output to console and capture to log file
          npx eas-cli build \
            --platform "$PLATFORM" \
            --profile "$PROFILE" \
            --non-interactive \
            $SUBMIT_FLAG 2>&1 | tee build_output.log

          # Extract Expo build URL
          BUILD_URL=$(grep -o -E 'https://expo\.dev/accounts/[^/]+/projects/[^/]+/builds/[a-f0-9-]+' build_output.log | head -n 1)

          if [ -z "$BUILD_URL" ]; then
            BUILD_URL=$(grep -o -E 'https://expo\.dev/artifacts/[^ ]*' build_output.log | head -n 1)
          fi

          echo "## 🚀 EAS Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Platform** | \`$PLATFORM\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Profile** | \`$PROFILE\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -n "$BUILD_URL" ]; then
            echo "### 📲 Download & Install" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🔗 **Direct Link**: [$BUILD_URL]($BUILD_URL)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### 📱 Scan QR Code on your Phone:" >> $GITHUB_STEP_SUMMARY
            ENCODED_URL=$(node -e "console.log(encodeURIComponent('$BUILD_URL'))")
            echo "<img src=\"https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=$ENCODED_URL\" alt=\"Install QR Code\" width=\"220\" height=\"220\" />" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> Scan the QR code with your phone camera or tap the link above to download and install the build." >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ *Build finished. Check logs above for detailed output.*" >> $GITHUB_STEP_SUMMARY
          fi
